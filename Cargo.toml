[package]
name = "endless-drawing-server"
version = "0.1.0"
edition = "2024"
description = "Single-process backend for a shared infinite drawing canvas"
publish = false
default-run = "endless-drawing-server"

[features]
browser-integration = []

[dependencies]
anyhow = "1"
aes-gcm = { version = "0.11", features = ["zeroize"] }
data-encoding = "2"
sha1 = "0.10"
subtle = "2"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util"] }
crypto-glue = "0.2.2"
serde_cbor_2 = "0.13"
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }
http-body-util = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = "deny"

[profile.release]
lto = "thin"
strip = true
