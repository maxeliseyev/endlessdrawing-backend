# Installed by bootstrap.sh under /opt/endlessdrawing. Private staging by default.
name: endlessdrawing

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in runtime.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in runtime.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in runtime.env}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 2g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    image: ${ENDLESSDRAWING_IMAGE:?Deployment helper must select an immutable release image}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - type: bind
        source: ${ADMIN_SECRETS_DIR:-/opt/endlessdrawing/admin-secrets}
        target: /run/admin-secrets
        read_only: true
        bind:
          create_host_path: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in runtime.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in runtime.env}
      BIND_ADDR: "0.0.0.0:3000"
      STATIC_DIR: /app/static
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://endlessdrawing.com}
      ADMIN_RP_ID: ${ADMIN_RP_ID:-endlessdrawing.com}
      ADMIN_TOTP_KEY_FILE: ${ADMIN_TOTP_KEY_FILE:-}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_MIGRATE_ON_START: ${DATABASE_MIGRATE_ON_START:-false}
      DATABASE_REQUIRE_RUNTIME_ROLE: ${DATABASE_REQUIRE_RUNTIME_ROLE:-false}
      DATABASE_MAX_CONNECTIONS: "10"
      DATABASE_ACQUIRE_TIMEOUT_MS: "5000"
      DATABASE_QUERY_TIMEOUT_MS: "5000"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge, private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    profiles: [maintenance]
    image: ${ENDLESSDRAWING_IMAGE:?Deployment helper must select an immutable release image}
    entrypoint: ["/app/canvas-migrate"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set separate migration URL in root-only runtime.env}
      RUNTIME_DATABASE_ROLE: ${RUNTIME_DATABASE_ROLE:-}
    networks: [private]

networks:
  edge: {}
  private:
    internal: true

volumes:
  postgres_data:
