# /etc/systemd/system/caddy.service.d/endlessdrawing.conf
# Caddy runs on the host; config env must not be confused with backend runtime.env.
[Service]
EnvironmentFile=/etc/endlessdrawing/caddy/caddy.env
# Do not inherit the vendor unit's --environ startup logging.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
