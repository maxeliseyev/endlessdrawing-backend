name: Backend CI

# PRs (required check for protected main); merges to main run it inside Deploy production.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canvas
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://canvas:canvas_ci_only@127.0.0.1:5432/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Registry and compiled dependencies; saved from main, reused by every run.
      - uses: Swatinem/rust-cache@v2
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: python3 -m unittest discover -s tests/deploy -v
      - run: ENDLESSDRAWING_IMAGE=endlessdrawing-app:preflight docker compose --env-file deploy/runtime.env.example -f deploy/compose.yml config --quiet
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets -- --include-ignored
      - name: Assert unused optional SQLite/MySQL graphs stay inactive
        run: |
          for pkg in libsqlite3-sys 'rsa@0.9.10'; do
            if [[ -n $(cargo tree --locked --target x86_64-unknown-linux-gnu -e normal,build -i "$pkg" 2>/dev/null) ]]; then
              echo "Optional dependency became active in the shipped build: $pkg" >&2
              exit 1
            fi
          done
