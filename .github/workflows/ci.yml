name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canvas
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://canvas:canvas_ci_only@127.0.0.1:5432/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets -- --include-ignored
